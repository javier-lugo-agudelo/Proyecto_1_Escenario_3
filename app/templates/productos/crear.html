{% extends "base.html" %}
{% block title %}Nuevo Producto{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7">
    <div class="card shadow-sm">
      <div class="card-header bg-primary text-white">
        <h5 class="mb-0"><i class="bi bi-plus-circle me-2"></i>Nuevo Producto</h5>
      </div>
      <div class="card-body">
        <form method="post" action="{{ url_for('inventario.crear') }}">
          <div class="mb-3">
            <label for="nombre" class="form-label fw-semibold">Nombre <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="nombre" name="nombre" required
                   placeholder="Ej. Laptop Dell Inspiron">
          </div>

          <div class="mb-3">
            <label for="descripcion" class="form-label fw-semibold">Descripción</label>
            <textarea class="form-control" id="descripcion" name="descripcion" rows="2"
                      placeholder="Descripción opcional del producto"></textarea>
          </div>

          <div class="mb-3">
            <label for="categoria_id" class="form-label fw-semibold">Categoría</label>
            <select class="form-select" id="categoria_id" name="categoria_id">
              <option value="">— Sin categoría —</option>
              {% for c in categorias %}
                <option value="{{ c.id }}">{{ c.nombre }}</option>
              {% endfor %}
            </select>
          </div>

          <div class="row">
            <div class="col-md-4 mb-3">
              <label for="precio" class="form-label fw-semibold">Precio ($)</label>
              <input type="number" class="form-control" id="precio" name="precio"
                     min="0" step="0.01" value="0">
            </div>
            <div class="col-md-4 mb-3">
              <label for="stock" class="form-label fw-semibold">Stock inicial</label>
              <input type="number" class="form-control" id="stock" name="stock"
                     min="0" value="0">
            </div>
            <div class="col-md-4 mb-3">
              <label for="stock_minimo" class="form-label fw-semibold">Stock mínimo</label>
              <input type="number" class="form-control" id="stock_minimo" name="stock_minimo"
                     min="0" value="5">
            </div>
          </div>

          <div class="d-flex gap-2 mt-2">
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-save me-1"></i>Guardar
            </button>
            <a href="{{ url_for('inventario.index') }}" class="btn btn-outline-secondary">
              <i class="bi bi-arrow-left me-1"></i>Cancelar
            </a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
