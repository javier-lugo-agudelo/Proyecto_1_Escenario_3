{% extends "base.html" %}
{% block title %}Editar Producto{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7">
    <div class="card shadow-sm">
      <div class="card-header bg-warning text-dark">
        <h5 class="mb-0"><i class="bi bi-pencil me-2"></i>Editar Producto</h5>
      </div>
      <div class="card-body">
        <form method="post" action="{{ url_for('inventario.editar', producto_id=producto.id) }}">
          <div class="mb-3">
            <label for="nombre" class="form-label fw-semibold">Nombre <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="nombre" name="nombre"
                   value="{{ producto.nombre }}" required>
          </div>

          <div class="mb-3">
            <label for="descripcion" class="form-label fw-semibold">Descripción</label>
            <textarea class="form-control" id="descripcion" name="descripcion"
                      rows="2">{{ producto.descripcion or '' }}</textarea>
          </div>

          <div class="mb-3">
            <label for="categoria_id" class="form-label fw-semibold">Categoría</label>
            <select class="form-select" id="categoria_id" name="categoria_id">
              <option value="">— Sin categoría —</option>
              {% for c in categorias %}
                <option value="{{ c.id }}"
                  {% if c.id == producto.categoria_id %}selected{% endif %}>
                  {{ c.nombre }}
                </option>
              {% endfor %}
            </select>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="precio" class="form-label fw-semibold">Precio ($)</label>
              <input type="number" class="form-control" id="precio" name="precio"
                     min="0" step="0.01" value="{{ producto.precio }}">
            </div>
            <div class="col-md-6 mb-3">
              <label for="stock_minimo" class="form-label fw-semibold">Stock mínimo</label>
              <input type="number" class="form-control" id="stock_minimo" name="stock_minimo"
                     min="0" value="{{ producto.stock_minimo }}">
            </div>
          </div>

          <div class="alert alert-info small">
            <i class="bi bi-info-circle me-1"></i>
            Para modificar el stock usa los movimientos de entrada/salida en el detalle del producto.
          </div>

          <div class="d-flex gap-2 mt-2">
            <button type="submit" class="btn btn-warning text-dark">
              <i class="bi bi-save me-1"></i>Guardar cambios
            </button>
            <a href="{{ url_for('inventario.detalle', producto_id=producto.id) }}"
               class="btn btn-outline-secondary">
              <i class="bi bi-arrow-left me-1"></i>Cancelar
            </a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
